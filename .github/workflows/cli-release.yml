name: cli-release

on:
  push:
    tags: ["cli-v*", "desktop-v*", "v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag to attach to (e.g. cli-v0.3.25 or desktop-v0.3.25)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            binary: pproxy-linux-amd64
          - target: aarch64-unknown-linux-musl
            binary: pproxy-linux-arm64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross prebuilt binary
        run: |
          mkdir -p ~/.cargo/bin
          curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar -xz -C ~/.cargo/bin
          chmod +x ~/.cargo/bin/cross

      - name: Build CLI with Cross
        run: |
          cross build --target ${{ matrix.target }} --release -p pproxy-cli
          cp target/${{ matrix.target }}/release/pproxy ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  build-macos-cli:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            binary: pproxy-macos-arm64
          - target: x86_64-apple-darwin
            binary: pproxy-macos-amd64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI natively for macOS
        run: |
          cargo build --target ${{ matrix.target }} --release -p pproxy-cli
          cp target/${{ matrix.target }}/release/pproxy ${{ matrix.binary }}
          chmod +x ${{ matrix.binary }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  build-windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build CLI for Windows
        shell: bash
        run: |
          cargo build --release -p pproxy-cli
          cp target/release/pproxy.exe pproxy-windows-x64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: pproxy-windows-x64
          path: pproxy-windows-x64.exe

  publish-release:
    needs: [build-linux-cli, build-macos-cli, build-windows-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;
          chmod +x release-assets/pproxy-linux-* release-assets/pproxy-macos-* 2>/dev/null || true
          ls -la release-assets

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.ref_name }}" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0)
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "Target Release Tag: $TAG"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, uploading assets..."
            gh release upload "$TAG" release-assets/* --clobber
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG")
            else
              CHANGES=$(git log -n 10 --pretty=format:"- %s (%h)")
            fi
            {
              echo "### 🚀 本次更新内容 (Release Highlights)"
              echo "$CHANGES"
              echo ""
              echo "---"
              echo "Windows x64 桌面端安装包（Pony.Proxy_*_x64-setup.exe）与多平台 CLI 二进制"
            } > /tmp/release_body.txt
            gh release edit "$TAG" --notes-file /tmp/release_body.txt --draft=false || true
          else
            echo "Release $TAG does not exist, generating changelog and creating release..."
            PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..$TAG")
            else
              CHANGES=$(git log -n 10 --pretty=format:"- %s (%h)")
            fi
            {
              echo "### 🚀 本次更新内容 (Release Highlights)"
              echo "$CHANGES"
              echo ""
              echo "---"
              echo "CLI (Linux amd64/arm64 musl, macOS arm64/amd64, Windows x64) 三平台发版"
            } > /tmp/release_body.txt
            gh release create "$TAG" release-assets/* --title "Pony Proxy $TAG" --notes-file /tmp/release_body.txt
          fi

      - name: Re-protect desktop update feed on general releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        # 根因（2026-10-02）：GitHub "latest" 按最近创建取 release，general/CLI 发布（如 v0.3.57）
        # 会把 releases/latest/download/latest.json 带向无 latest.json 的 release → 桌面端检查更新 404。
        # 此处把当前最新 desktop release 的 latest.json 复制进本次 release，保证 releases/latest 永不 404；
        # 并校验 GitHub latest 通道仍能解析出合法 feed（见 .agents/notes/implemented/bug-fix/2026-10-02-...）。
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          case "$TAG" in
            desktop-*) echo "desktop release，latest.json 已由 tauri-action 上传，跳过复制" ;;
            *)
              DT="$(gh release list --repo lanhui100/pproxy --limit 50 --json tagName --jq '.[].tagName' | grep '^desktop-v' | sort -V | tail -1 || true)"
              if [ -n "$DT" ]; then
                echo "Copying latest.json from desktop release $DT to $TAG"
                mkdir -p feed-assets
                gh release download "$DT" --repo lanhui100/pproxy --pattern latest.json --dir feed-assets
                gh release upload "$TAG" feed-assets/latest.json --clobber
              else
                echo "WARN: 未找到 desktop release，跳过 feed 复制"
              fi
              bash scripts/check-update-feed.sh --github-only
              ;;
          esac

