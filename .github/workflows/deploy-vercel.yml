# gitOps 部署 Vercel 双项目（2026-09 整改）：
# - push 到 master（仅 deploy/vercel/** 或 deploy/vercel-gate-worker/** 变更）触发生产部署；
# - 用 `git archive` 抽出源码到无 .git 的临时目录再 `vercel deploy`：
#   Vercel 新策略对 private 仓库按 commit author 校验（TEAM_ACCESS_REQUIRED），
#   无 .git 元数据即无 author 可校验，绕开席位校验（2026-09-11 实测可用）；
# - 项目链接走 VERCEL_ORG_ID / VERCEL_PROJECT_ID 环境变量（.vercel/ 不入库）；
# - 只部署发生变更的项目；workflow_dispatch 可手动全量部署。
name: deploy-vercel

on:
  push:
    branches: [master]
    paths:
      - 'deploy/vercel/**'
      - 'deploy/vercel-gate-worker/**'
  workflow_dispatch:

jobs:
  deploy-edge:
    name: Deploy pproxy-edge-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes (deploy/vercel)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- deploy/vercel | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage files without .git (bypass author-attribution check)
        if: steps.changes.outputs.changed == 'true'
        run: |
          rm -rf /tmp/vdeploy && mkdir -p /tmp/vdeploy
          git archive HEAD deploy/vercel | tar -x -C /tmp/vdeploy

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Deploy to Vercel (pproxy-edge-v2)
        if: steps.changes.outputs.changed == 'true'
        working-directory: /tmp/vdeploy/deploy/vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_EDGE }}
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

  deploy-gate:
    name: Deploy vercel-gate-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect changes (deploy/vercel-gate-worker)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- deploy/vercel-gate-worker | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage files without .git (bypass author-attribution check)
        if: steps.changes.outputs.changed == 'true'
        run: |
          rm -rf /tmp/vgdeploy && mkdir -p /tmp/vgdeploy
          git archive HEAD deploy/vercel-gate-worker | tar -x -C /tmp/vgdeploy

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Deploy to Vercel (vercel-gate-worker)
        if: steps.changes.outputs.changed == 'true'
        working-directory: /tmp/vgdeploy/deploy/vercel-gate-worker
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_GATE }}
        run: npx -y vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"