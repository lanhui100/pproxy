# desktop-release — 仅 tag 触发（无 paths，杜绝跳过）：NSIS 安装包挂 GitHub Release
# workflow_dispatch：tag 事件偶发丢失时的手动兜底入口（--ref desktop-vX.Y.Z）
# 未签名构建：SmartScreen 提示属预期（spec §7.2）
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@f40ffcd9367d
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: frontend build
        run: pnpm build
        working-directory: desktop

      - name: Prepare updater endpoints fragment (build-time injection)
        shell: bash
        # tracked tauri.conf.json 保持开源中立占位；发版时经 UPDATER_ENDPOINTS secret 注入真实
        # 分发地址（逗号分隔）。secret 未设时回落占位端点，保证构建确定性。
        env:
          UPDATER_ENDPOINTS: ${{ secrets.UPDATER_ENDPOINTS }}
        run: |
          node -e '
            const fs = require("fs");
            const src = (process.env.UPDATER_ENDPOINTS || "")
              .split(",").map(s => s.trim()).filter(Boolean);
            const def = [
              "https://github.com/lanhui100/pproxy/releases/latest/download/latest.json",
              "https://dl.example.com/latest.json",
              "https://access.example.com/dsk/latest.json",
            ];
            fs.writeFileSync(
              "desktop/src-tauri/tauri.updater.json",
              JSON.stringify({ plugins: { updater: { endpoints: src.length ? src : def } } })
            );
          '
          cat desktop/src-tauri/tauri.updater.json

      - name: Generate Release Notes
        id: release_notes
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "Previous tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG..${{ github.ref_name }}")
          else
            CHANGES=$(git log -n 10 --pretty=format:"- %s (%h)")
          fi
          {
            echo "notes<<EOF"
            echo "### 🚀 本次更新内容 (Release Highlights)"
            echo "$CHANGES"
            echo ""
            echo "---"
            echo "Windows x64 NSIS 安装包（中文安装界面；未签名，SmartScreen 提示属预期）。应用内「检查更新」亦可自动升级。"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@fce9c6108b31
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pony Proxy ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          projectPath: desktop
          args: --config src-tauri/tauri.updater.json

      - name: Deploy static distribution to Vercel
        if: env.VERCEL_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # 分发基础地址（开源中立默认占位；发版方在仓库 secrets 设 PPROXY_DIST_BASE 指向自己的分发域名）
          PPROXY_DIST_BASE: ${{ secrets.PPROXY_DIST_BASE }}
        run: |
          mkdir -p dist-assets
          gh release download "${{ github.ref_name }}" --dir dist-assets
          scripts/publish-desktop-dist.sh dist-assets dist-assets/latest.json

      - name: Sync desktop assets to general release tag (e.g. vX.Y.Z)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          GEN_TAG="${GITHUB_REF_NAME#desktop-}"
          if [ "$GEN_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "Checking if general release $GEN_TAG exists..."
            for i in {1..12}; do
              if gh release view "$GEN_TAG" >/dev/null 2>&1; then
                echo "Release $GEN_TAG found, uploading desktop artifacts and latest.json..."
                mkdir -p sync-assets
                gh release download "$GITHUB_REF_NAME" --dir sync-assets
                gh release upload "$GEN_TAG" sync-assets/* --clobber
                break
              fi
              echo "Waiting for $GEN_TAG to be created ($i/12)..."
              sleep 10
            done
          fi
