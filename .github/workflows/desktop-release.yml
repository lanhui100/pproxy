# desktop-release — 仅 tag 触发（无 paths，杜绝跳过）：NSIS 安装包挂 GitHub Release
# workflow_dispatch：tag 事件偶发丢失时的手动兜底入口（--ref desktop-vX.Y.Z）
# 未签名构建：SmartScreen 提示属预期（spec §7.2）
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@f40ffcd9367d
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: desktop

      - name: frontend build
        run: pnpm build
        working-directory: desktop

      - uses: tauri-apps/tauri-action@fce9c6108b31
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名密钥：tauri-action 检测到即生成 .sig 与 latest.json（自更新清单）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pony Proxy ${{ github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message || '手动触发的自动发布' }}

            ---
            Windows x64 NSIS 安装包（中文安装界面；未签名，SmartScreen 提示属预期）。应用内「检查更新」亦可自动升级。
          releaseDraft: false
          prerelease: false
          projectPath: desktop
