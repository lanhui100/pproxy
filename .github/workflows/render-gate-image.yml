name: render-gate-image

# 构建并推送 render-gate 容器镜像到 GHCR，供免卡容器平台（ClawCloud Run/Koyeb 等）拉取部署。
on:
  push:
    branches: [master]
    paths:
      - deploy/render-gate/**
      - .github/workflows/render-gate-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: deploy/render-gate
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pproxy-render-gate:latest
            ghcr.io/${{ github.repository_owner }}/pproxy-render-gate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
