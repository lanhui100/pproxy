name: tz-probe3
on: push
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lanhui100/pproxy/releases \
            -d '{"tag_name":"tz-tag-2","name":"tz2","draft":true}' | head -c 400
