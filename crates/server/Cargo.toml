[package]
name = "pproxy-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "pproxy_server"
path = "src/lib.rs"

[[bin]]
name = "pproxy-server"
path = "src/main.rs"

[dependencies]
pproxy-core = { path = "../core" }
pproxy-transport.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures.workspace = true
# CONNECT 隧道客户端（pproxy-connect-tunnel spec §3.3）：与桌面端同版本同 feature
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls 0.23 需要 install_default CryptoProvider（tokio-tungstenite 的依赖）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "rustls-tls"] }
tower = { version = "0.5" }
rand.workspace = true

# T4a L2-T/L2-AT 红相验收测试（test-agent 冻结）：集成测试（crates/server/tests/）
# 为独立 crate，需自行声明运行依赖（lib 的 [dependencies] 不传递到 tests/）。
[dev-dependencies]
tokio.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde_json.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
pproxy-core = { path = "../core" }
