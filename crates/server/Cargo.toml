[package]
name = "pproxy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
pproxy-core = { path = "../core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
futures.workspace = true
# CONNECT 隧道客户端（pproxy-connect-tunnel spec §3.3）：与桌面端同版本同 feature
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# rustls 0.23 需要 install_default CryptoProvider（tokio-tungstenite 的依赖）
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["charset", "rustls-tls"] }
tower = { version = "0.5" }
