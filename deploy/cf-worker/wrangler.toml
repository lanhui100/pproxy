# ⚠️ 开源中立占位：本文件内域名（如 edge.example.com）均为占位符。
# 部署前改回你自己的自定义域名，否则 wrangler deploy 会失败。
name = "pproxy-edge"
main = "worker.js"
compatibility_date = "2026-08-20"
# F1：关闭 workers.dev 默认域名，仅经 custom domain 暴露
workers_dev = false

routes = [
  { pattern = "edge.ponygo.fun", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "*"
# F1：PROXY_SECRET 为共享凭据，禁止入库。部署时执行：
#   npx wrangler secret put PROXY_SECRET
