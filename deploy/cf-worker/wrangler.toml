name = "pproxy-edge"
main = "worker.js"
compatibility_date = "2026-08-20"
# F1：关闭 workers.dev 默认域名，仅经 custom domain 暴露
workers_dev = false

routes = [
  { pattern = "edge.ponyjob.top", custom_domain = true }
]

[vars]
ALLOWED_ORIGINS = "*"
# F1：PROXY_SECRET 为共享凭据，禁止入库。部署时执行：
#   npx wrangler secret put PROXY_SECRET
