# deploy/nginx/stream-connect.conf — pproxy 公网 CONNECT 入口（契约 C2）
#
# 前置步骤（stream 是动态模块，缺模块必然 `unknown directive "stream"`）：
#   sudo apt-get install -y libnginx-mod-stream
#   nginx -V 2>&1 | grep -q with-stream        # 生产机为 --with-stream=dynamic
#   ls /etc/nginx/modules-enabled/             # 安装后生成 50-mod-stream.conf
#   （安装前 modules-enabled/ 为空，nginx -t 报 unknown directive "stream"。）
#
# 放置位置（唯一姿势，实测有效）：
#   sudo mkdir -p /etc/nginx/stream-connect
#   sudo cp deploy/nginx/stream-connect.conf /etc/nginx/stream-connect/stream-connect.conf
#   # 在 /etc/nginx/nginx.conf **顶层**（与既有 http { ... } 同级）追加一行：
#   #     include /etc/nginx/stream-connect/*.conf;
#   #
#   # 严禁放进 /etc/nginx/conf.d/：该机 nginx.conf 的 `include /etc/nginx/conf.d/*.conf;`
#   # 位于 http {} **内部**（下一行即 http 块闭合大括号），stream{} 放进去会报
#   # "stream directive is not allowed here"。
#
# 部署清单（硬步骤，顺序不可省）：
#   1) sudo apt-get install -y libnginx-mod-stream
#   2) sudo ufw allow 8443/tcp
#      —— 该机 ufw 默认 policy DROP，仅放行 22/80/443。漏掉此步，外部 CONNECT 会**静默超时**
#         （nginx 日志无任何报错，本次部署实测踩到）。核验：sudo ufw status numbered | grep 8443
#   3) 放置配置 + nginx.conf 顶层追加 include（见上）
#   4) sudo nginx -t                 # 必须 exit 0（校验模块已加载、证书路径、stream 语法）
#      sudo systemctl reload nginx   # 零停机；不触碰既有 443 server 块
#   5) 机器收据：
#      ss -tlnp | grep 8443                                   # 期望 0.0.0.0:8443
#      openssl s_client -connect rn.ponygo.fun:8443 -servername rn.ponygo.fun </dev/null 2>/dev/null | head -1
#      printf 'CONNECT example.com:80 HTTP/1.1\r\nHost: example.com:80\r\n\r\n' | nc -w 5 rn.ponygo.fun 8443
#        → 期望首行 HTTP/1.1 407 Proxy Authentication Required
#          （证明 8443 已放行 + TLS 终结 + 转发到 127.0.0.1:3102 全链路通）
#
# 反向链路：
#   Clash Meta (type: http, tls: true, port: 8443) → nginx stream 8443（TLS 终结）
#     → proxy_pass 127.0.0.1:3102 → pproxy-gate-server CONNECT 监听
#         （systemd 环境变量 GATE_CONNECT_LISTEN=127.0.0.1:3102，
#           见 systemd/pony-gate-rust.service.d-connect.conf）
#
# 语义与契约（C1）对齐：
#   * 既有 443 的 http server 块（/api/clash、/ws 等）语义**不做任何修改**。CONNECT 走独立 8443，
#     因为 nginx 的 http 核心不转发 CONNECT 方法（实测 400 Bad Request / Server: nginx）。
#   * 本层是纯 TCP 转发：不解密内容、不感知 HTTP 语义；鉴权/ACL 全部由 gate-server 的 CONNECT
#     监听完成 —— 凭据缺失或错误 → 407（带 Proxy-Authenticate: Basic realm="pproxy"）；
#     目标非 443 或 host 非法 → 403；目标建连失败/超时 → 502。
#   * 配额口径（Lead 已裁决，接受现状）：多租户累计用量达 `quota_bytes` → 403 +
#     `X-Pony-Reason: quota_exceeded`；CONNECT 数据面**不新增 402**（与 /ws 的 402 差异为既定裁决）。
#   * proxy_timeout 86400s 对齐 gate-server 单连接绝对生命周期上限（默认 86400s，
#     可由 GATE_CONNECT_MAX_LIFETIME_SECS 覆盖）。

stream {
    server {
        listen 8443 ssl;
        ssl_certificate     /etc/letsencrypt/live/rn.ponygo.fun/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rn.ponygo.fun/privkey.pem;

        proxy_pass 127.0.0.1:3102;
        proxy_timeout 86400s;
    }
}
