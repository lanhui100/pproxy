# Render Blueprint（可选便利；手动 New Web Service 路径见 README.md）
services:
  - type: web
    name: pproxy-render-gate
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TUNNEL_TOKEN_HASH
        sync: false # 部署后在 Dashboard 填入隧道 token 的 sha256 hex
      - key: KEEPALIVE_URL
        sync: false # 填 https://<app>.onrender.com（部署后可见域名再回填）
