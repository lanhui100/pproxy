# systemd/pony-gate-rust.service.d-connect.conf — pproxy-gate-server CONNECT 数据面开关（契约 C1）
#
# 生产 unit 名（实测）：`pony-gate-rust.service`
#   主 unit 实参：EnvironmentFile=/opt/pproxy/.gate-server.env
#                ExecStart=/opt/pproxy/bin/pproxy-gate-server --host 127.0.0.1 --port 3101
#
# 部署（drop-in，不改动主 unit）：
#   sudo mkdir -p /etc/systemd/system/pony-gate-rust.service.d/
#   sudo cp systemd/pony-gate-rust.service.d-connect.conf \
#           /etc/systemd/system/pony-gate-rust.service.d/connect.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart pony-gate-rust.service     # 新增监听需 restart（daemon-reload 不会绑定新端口）
#
# 生效判据（部署后必查）：
#   systemctl show pony-gate-rust.service -p Environment | tr ' ' '\n' | grep GATE_CONNECT_LISTEN
#   journalctl -u pony-gate-rust.service -n 50 | grep "HTTP CONNECT proxy listening"
#   ss -tlnp | grep 3102          # 期望 127.0.0.1:3102（仅回环，公网由 nginx 8443 进入）
#
# 部署清单（与 nginx 侧的硬步骤配套）：
#   1) sudo ufw allow 3102/tcp   ← **不要**。3102 只绑回环，公网入口是 8443；
#      需放行的是 8443：sudo ufw allow 8443/tcp（详见 deploy/nginx/stream-connect.conf 部署清单）。
#   2) sudo systemctl restart pony-gate-rust.service
#   3) 本机收据：curl -x http://127.0.0.1:3102 -U <token>:<token> -sS -o /dev/null \
#                  -w '%{http_code}\n' https://www.gstatic.com/generate_204   → 204
#
# 语义：
#   * GATE_CONNECT_LISTEN 未设置/为空 → CONNECT 监听不启动（fail-closed，仅一行 info 日志）；
#     既有的 /ws、/clash、/proxy 路由面完全不受影响。
#   * 只绑回环：公网入口由 nginx stream 8443 终结 TLS 后转发（deploy/nginx/stream-connect.conf），
#     gate-server 自身绝不对公网直接监听该端口。
#   * 令牌语义与 /ws 同源：TUNNEL_TOKEN_HASH 的 sha256 单口令，或 usr_live_ 用户令牌验签+撤销表。
#   * 配额口径（Lead 已裁决，接受现状）：累计 user_used_bytes 达 quota_bytes → CONNECT 回
#     403 + X-Pony-Reason: quota_exceeded（不新增 402；与 /ws 的 402 差异为既定裁决）。
#   * GATE_CONNECT_MAX_LIFETIME_SECS 可选（缺省 86400，对齐 nginx stream proxy_timeout）。

[Service]
Environment=GATE_CONNECT_LISTEN=127.0.0.1:3102
# 可选：单连接绝对生命周期上限（秒）
# Environment=GATE_CONNECT_MAX_LIFETIME_SECS=86400
